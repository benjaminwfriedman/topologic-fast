[workspace]
resolver = "2"
members = [
    "crates/topologic-core",
    "crates/topologic-py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/benjaminwfriedman/topologic-fast"

[workspace.dependencies]
# Core dependencies - compatible with Rust 1.70
nalgebra = "0.32"
glam = { version = "0.24", features = ["serde"] }
parry3d = "0.13"
rayon = "1.7"
smallvec = { version = "1.10", features = ["union", "const_generics"] }
hashbrown = { version = "0.13", features = ["rayon", "serde"] }
indexmap = { version = "1.9", features = ["rayon"] }
parking_lot = "0.12"
crossbeam = "0.8"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytemuck = { version = "1.13", features = ["derive"] }

# Python bindings
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"

# Testing
approx = "0.5"
criterion = "0.4"
proptest = "1.2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3

[profile.bench]
lto = "thin"
